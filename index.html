<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>N站 NovelNovel - 创作者中心</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F7F8;--card:#FFF;--text:#111;--sub:#666;--light:#999;--border:#EAEAEA;--hover:#F2F2F2;--primary:#111;--primary-h:#333;--danger:#E5484D;--success:#30A46C;--sh-sm:0 1px 3px rgba(0,0,0,0.05);--sh-md:0 4px 16px rgba(0,0,0,0.06);--sh-lg:0 12px 32px rgba(0,0,0,0.08);--r-sm:6px;--r:12px;--r-lg:20px;--pill:999px;--h-h:60px;--tab-h:56px;--maxw:1100px;--fs:17px;--ease:cubic-bezier(0.25,1,0.5,1)}
body.dark{--bg:#0A0A0A;--card:#171717;--text:#EDEDED;--sub:#A1A1A1;--light:#666;--border:#262626;--hover:#262626;--primary:#FFF;--primary-h:#E5E5E5;--sh-sm:0 1px 2px rgba(0,0,0,0.4);--sh-md:0 4px 16px rgba(0,0,0,0.5);--sh-lg:0 12px 32px rgba(0,0,0,0.6)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:"Manrope",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;transition:background .3s,color .3s;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom);overflow-y:auto;overflow-x:hidden;}
body.lock{overflow:hidden !important}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}img{max-width:100%;display:block}ul{list-style:none}a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.skip{position:absolute;left:-9999px;top:0;z-index:9999;background:var(--card);padding:10px}.skip:focus{left:0}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}::-webkit-scrollbar-track{background:transparent}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
@keyframes popIn{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.anim-up{animation:fadeUp .6s var(--ease) forwards;opacity:0}.anim-in{animation:fadeIn .4s var(--ease) forwards;opacity:0}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}
/* 入场 */
#splash{position:fixed;inset:0;z-index:99999;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .5s,visibility .5s}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-inner{text-align:center;display:flex;flex-direction:column;align-items:center}
.splash-logo{font-size:42px;font-weight:600;letter-spacing:-1px;margin-bottom:8px}
.splash-sub{font-size:15px;color:var(--sub);margin-bottom:48px}
.splash-btn{background:var(--primary);color:var(--bg);padding:14px 48px;font-size:15px;font-weight:600;border-radius:var(--pill);border:none;transition:.2s var(--ease);box-shadow:0 4px 14px rgba(0,0,0,.1)}
.splash-btn:hover{background:var(--primary-h);transform:translateY(-2px)}.splash-btn:active{transform:scale(.96)}
/* Header */
header{position:sticky;top:0;z-index:100;height:var(--h-h);background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);transition:transform .3s var(--ease)}
body.dark header{background:rgba(10,10,10,.85)}
.h-inner{max-width:var(--maxw);height:100%;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:24px}
.logo{font-size:20px;font-weight:700;background:none;border:none;letter-spacing:-.5px;flex-shrink:0}
.nav-links{display:flex;gap:8px;flex-shrink:0}
.nav-links button{background:none;border:none;padding:6px 12px;font-size:14px;font-weight:500;color:var(--sub);border-radius:var(--r-sm);transition:.2s}
.nav-links button:hover{color:var(--text);background:var(--hover)}
.search-box{flex:1;max-width:320px;margin-left:auto;position:relative;display:flex;align-items:center}
.search-box svg{position:absolute;left:12px;width:16px;height:16px;color:var(--light)}
.search-box input{width:100%;height:36px;border-radius:var(--pill);border:1px solid transparent;background:var(--hover);padding:0 16px 0 36px;font-size:13px;outline:none;transition:.2s}
.search-box input:focus{background:var(--card);border-color:var(--border)}
.h-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.btn-text{background:none;border:none;font-size:13px;font-weight:500;color:var(--sub);padding:6px 12px}.btn-text:hover{color:var(--text)}
.btn-solid{background:var(--primary);color:var(--bg);border:none;padding:8px 16px;border-radius:var(--r-sm);font-size:13px;font-weight:600;transition:.2s}
.btn-solid:hover{background:var(--primary-h)}

/* 桌面端用户菜单 */
.u-menu{position:relative;}
.u-trigger{background:none;border:none;padding:2px;border-radius:50%}
.avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid var(--border)}
.hover-card{position:absolute;top:calc(100% + 8px);right:0;width:240px;background:var(--card);border-radius:var(--r);box-shadow:var(--sh-lg);border:1px solid var(--border);padding:16px;opacity:0;visibility:hidden;transform:translateY(-10px);pointer-events:none;transition:opacity .2s var(--ease), transform .2s var(--ease), visibility .2s;z-index:200}
/* JS 控制的显隐，替代 CSS hover */
.u-menu.active .hover-card{opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto}
/* 衔接桥梁，防止鼠标移过去时短暂离开 */
.hover-card::before{content:'';position:absolute;top:-12px;left:0;right:0;height:12px;background:transparent;}

.h-name{font-size:15px;font-weight:700;margin-bottom:4px;text-align:center}.h-sub{font-size:12px;color:var(--sub);text-align:center;margin-bottom:12px}
.h-stats{display:flex;justify-content:space-around;padding:12px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:12px}
.h-stat .n{font-size:14px;font-weight:700}.h-stat .l{font-size:11px;color:var(--sub)}
.h-menu a{display:flex;padding:8px 12px;font-size:13px;font-weight:500;border-radius:var(--r-sm);transition:.2s;cursor:pointer}
.h-menu a:hover{background:var(--hover)}.h-menu a.danger{color:var(--danger)}

/* 移动端底部抽屉用户菜单 */
.mobile-menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9998;opacity:0;visibility:hidden;transition:.3s}
.mobile-menu-overlay.show{opacity:1;visibility:visible;}
.mobile-menu-sheet{position:fixed;bottom:0;left:0;right:0;z-index:9999;background:var(--card);border-radius:var(--r-lg) var(--r-lg) 0 0;transform:translateY(100%);transition:transform .3s var(--ease);padding:24px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -4px 24px rgba(0,0,0,.1);}
.mobile-menu-sheet.show{transform:translateY(0);}
.mobile-menu-header{text-align:center;margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--border);}
.mobile-menu-header .h-name{font-size:18px;}
.mobile-menu-list{display:flex;flex-direction:column;gap:8px;}
.mobile-menu-list a{display:block;padding:12px 16px;font-size:15px;font-weight:500;border-radius:var(--r-sm);text-align:center;background:var(--hover);}
.mobile-menu-list a.danger{color:var(--danger);background:transparent;}

/* 分类 */
.cat-bar{border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:var(--h-h);z-index:90;transition:transform .3s var(--ease)}
.cat-inner{max-width:var(--maxw);margin:0 auto;padding:12px 24px;display:flex;gap:12px;overflow-x:auto;scrollbar-width:none}
.cat-inner::-webkit-scrollbar{display:none}
.cat-item{background:none;border:none;font-size:14px;font-weight:500;color:var(--sub);padding:4px 0;white-space:nowrap;position:relative;transition:.2s}
.cat-item.active{color:var(--text);font-weight:600}
.cat-item.active::after{content:'';position:absolute;bottom:-4px;left:0;right:0;height:2px;background:var(--text);border-radius:2px}
main{max-width:var(--maxw);margin:0 auto;padding:32px 24px 80px;min-height:60vh}
.section{margin-bottom:48px}
.sec-title{font-size:18px;font-weight:600;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between}
/* 首页 */
.feat-layout{display:grid;grid-template-columns:1.5fr 1fr;gap:24px}
.feat-main{display:flex;background:var(--card);border-radius:var(--r-lg);border:1px solid var(--border);overflow:hidden;cursor:pointer;transition:.3s var(--ease)}
.feat-main:hover{transform:translateY(-4px);box-shadow:var(--sh-md)}
.fm-cover{width:40%;background:var(--hover);display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--light);flex-shrink:0}
.fm-cover img{width:100%;height:100%;object-fit:cover}
.fm-info{padding:32px;display:flex;flex-direction:column;justify-content:center}
.fm-title{font-size:24px;font-weight:700;margin-bottom:8px;line-height:1.3}
.fm-author{font-size:13px;color:var(--sub);margin-bottom:16px}
.fm-intro{font-size:14px;color:var(--sub);line-height:1.6;margin-bottom:20px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fm-tags{display:flex;gap:8px}
.fm-tags span{background:var(--hover);padding:4px 10px;border-radius:var(--r-sm);font-size:12px;color:var(--sub)}
.feat-side{display:grid;grid-auto-rows:1fr;gap:16px}
.side-card{display:flex;gap:16px;padding:12px;background:var(--card);border-radius:var(--r);border:1px solid var(--border);cursor:pointer;transition:.2s}
.side-card:hover{transform:translateX(4px);box-shadow:var(--sh-sm);border-color:var(--border)}
.side-cover{width:60px;height:80px;background:var(--hover);border-radius:var(--r-sm);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--light);overflow:hidden}
.side-cover img{width:100%;height:100%;object-fit:cover}
.side-info{display:flex;flex-direction:column;justify-content:center;min-width:0}
.side-title{font-size:14px;font-weight:600;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-meta{font-size:12px;color:var(--sub)}
.books-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:24px}
.book-card{cursor:pointer}
.book-cover{width:100%;aspect-ratio:3/4;background:var(--hover);border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--light);overflow:hidden;margin-bottom:12px;transition:.3s var(--ease);box-shadow:var(--sh-sm)}
.book-cover img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
.book-card:hover .book-cover{box-shadow:var(--sh-md);transform:translateY(-4px)}
.book-card:hover .book-cover img{transform:scale(1.05)}
.book-title{font-size:14px;font-weight:600;margin-bottom:4px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book-author{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skeleton{background:linear-gradient(90deg,var(--hover) 25%,var(--border) 50%,var(--hover) 75%);background-size:400px 100%;animation:shimmer 1.5s infinite linear;border-radius:var(--r)}
.sk-card{aspect-ratio:3/4}
.empty{text-align:center;padding:80px 20px}.empty h2{font-size:20px;font-weight:600;margin-bottom:8px}.empty p{color:var(--sub);margin-bottom:24px}
/* 详情页 */
.detail-wrap{max-width:800px;margin:0 auto;background:var(--card);border-radius:var(--r-lg);padding:48px;box-shadow:var(--sh-sm);border:1px solid var(--border)}
.detail-header{display:flex;gap:40px;margin-bottom:40px;border-bottom:1px solid var(--border);padding-bottom:40px}
.detail-cover{width:200px;aspect-ratio:3/4;background:var(--hover);border-radius:var(--r);flex-shrink:0;overflow:hidden;box-shadow:var(--sh-md)}
.detail-cover img{width:100%;height:100%;object-fit:cover}
.detail-info{flex:1;display:flex;flex-direction:column}
.detail-title{font-size:32px;font-weight:700;margin-bottom:12px}
.detail-meta{font-size:14px;color:var(--sub);margin-bottom:24px}
.detail-intro{font-size:15px;line-height:1.8;color:var(--text);margin-bottom:32px;flex:1}
.detail-actions{display:flex;gap:12px}
/* 阅读页 */
.read-bar{position:absolute;bottom:0;left:0;height:2px;width:0%;background:var(--text);z-index:101;transition:width .1s;pointer-events:none}
.r-toolbar{max-width:var(--maxw);margin:32px auto 16px;padding:0 24px;display:flex;align-items:center;gap:16px;transition:opacity .3s}
.r-author{display:flex;align-items:center;gap:8px;cursor:pointer}
.a-avatar{width:28px;height:28px;border-radius:50%}.a-name{font-weight:600;font-size:14px}
.r-actions{display:flex;gap:12px;margin-left:auto}
.act-btn{background:none;border:1px solid var(--border);color:var(--sub);padding:6px 12px;border-radius:var(--pill);font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.act-btn:hover{border-color:var(--text);color:var(--text)}.act-btn.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.act-btn svg{width:16px;height:16px}
.r-layout{max-width:var(--maxw);margin:0 auto;padding:0 24px 80px;display:grid;grid-template-columns:240px 1fr;gap:48px}
.ch-list{position:sticky;top:calc(var(--h-h) + 40px);max-height:calc(100vh - var(--h-h) - 80px);overflow-y:auto;transition:opacity .3s}
.ch-list h3{font-size:15px;font-weight:600;margin-bottom:16px}
.ch-list li{padding:10px 12px;font-size:14px;color:var(--sub);border-radius:var(--r-sm);cursor:pointer;transition:.2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-list li:hover{background:var(--hover);color:var(--text)}.ch-list li.active{background:var(--hover);color:var(--text);font-weight:600}
.r-content{background:var(--card);border-radius:var(--r-lg);padding:48px 64px;box-shadow:var(--sh-sm);border:1px solid var(--border);min-width:0}
.r-title{font-size:32px;font-weight:700;margin-bottom:12px;letter-spacing:-.5px}
.r-meta{font-size:14px;color:var(--sub);margin-bottom:40px;display:flex;gap:16px}
.r-controls{display:flex;align-items:center;gap:8px;margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--border)}
.f-btn{background:var(--hover);border:none;width:32px;height:32px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--text);font-weight:600;transition:.2s}
.f-btn:hover{background:var(--border)}.f-label{font-size:13px;color:var(--sub);margin:0 4px}
.ch-title{font-size:22px;font-weight:600;margin-bottom:32px}
.ch-text{font-size:var(--fs);line-height:1.9;max-width:42em;margin:0 auto;color:var(--text)}
.ch-text p{margin-bottom:1.2em;text-indent:2em}
.ch-nav{display:flex;justify-content:space-between;margin-top:64px;padding-top:24px;border-top:1px solid var(--border)}
.btn-nav{background:var(--hover);border:none;padding:10px 24px;border-radius:var(--r-sm);font-weight:500;color:var(--text);transition:.2s}
.btn-nav:hover:not(:disabled){background:var(--border)}.btn-nav:disabled{opacity:.5;cursor:not-allowed}
/* 沉浸模式 */
body.zen header,body.zen .cat-bar,body.zen .mobile-tabbar{transform:translateY(-100%);opacity:0;pointer-events:none}
body.zen .r-toolbar,body.zen .ch-list{opacity:0;pointer-events:none}
body.zen .r-content{border:none;box-shadow:none;background:transparent;padding-top:20px}
.zen-exit{display:none;position:fixed;top:20px;left:20px;z-index:1000;background:var(--card);border:1px solid var(--border);padding:8px 16px;border-radius:var(--pill);box-shadow:var(--sh-md);font-weight:600}
body.zen .zen-exit{display:block}
/* 作者后台 */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.dash-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px;box-shadow:var(--sh-sm);display:flex;gap:16px;transition:.2s}
.dash-card:hover{box-shadow:var(--sh-md)}
.dash-cover{width:80px;height:106px;background:var(--hover);border-radius:var(--r-sm);overflow:hidden;flex-shrink:0}
.dash-cover img{width:100%;height:100%;object-fit:cover}
.dash-info{flex:1;min-width:0;display:flex;flex-direction:column}
.dash-title{font-size:16px;font-weight:700;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash-stats{font-size:12px;color:var(--sub);display:flex;gap:12px;margin-bottom:12px}
.dash-actions{display:flex;gap:8px;margin-top:auto}
.editor-toolbar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--hover);border:1px solid var(--border);border-bottom:none;border-radius:var(--r) var(--r) 0 0;font-size:12px;color:var(--sub)}
.editor-area{border:1px solid var(--border);border-radius:0 0 var(--r) var(--r);background:var(--bg);padding:16px;min-height:300px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;line-height:1.8;outline:none;resize:vertical;width:100%;transition:.2s}
.editor-area:focus{border-color:var(--text);background:var(--card)}
.draft-status{font-size:12px;color:var(--success);display:flex;align-items:center;gap:4px}
/* 评论 */
.comments{margin-top:64px;padding-top:32px;border-top:1px solid var(--border)}
.comments h3{font-size:18px;font-weight:600;margin-bottom:24px}
.c-form textarea{width:100%;min-height:80px;padding:16px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);outline:none;resize:vertical;margin-bottom:12px;transition:.2s}
.c-form textarea:focus{border-color:var(--text);background:var(--card)}
.c-form .actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.c-form .hint{font-size:12px;color:var(--sub)}
.comment{display:flex;gap:16px;padding:20px 0;border-bottom:1px solid var(--border)}
.comment:last-child{border-bottom:none}
.c-av{width:36px;height:36px;border-radius:50%;background:var(--hover);object-fit:cover;flex-shrink:0}
.c-body{flex:1;min-width:0}
.c-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.c-name{font-weight:600;font-size:14px}.c-badge{background:var(--primary);color:var(--bg);font-size:10px;padding:1px 6px;border-radius:4px;font-weight:700}
.c-badge.up{background:var(--text);color:var(--bg)}
.c-time{font-size:12px;color:var(--light)}
.c-text{font-size:14px;line-height:1.6;margin-bottom:8px;word-break:break-word}
.c-actions{display:flex;gap:16px}
.c-actions button{background:none;border:none;font-size:12px;color:var(--sub);cursor:pointer;padding:0;transition:.2s}
.c-actions button:hover{color:var(--text)}.c-actions button.liked{color:var(--text);font-weight:600}.c-actions button.danger:hover{color:var(--danger)}
.replies{margin-top:12px;padding-left:16px;border-left:2px solid var(--border)}
.replies .comment{padding:12px 0;border-bottom:none;gap:12px}
.replies .c-av{width:28px;height:28px}
/* 个人/发布 */
.p-card{max-width:600px;margin:0 auto;background:var(--card);border-radius:var(--r-lg);padding:40px;box-shadow:var(--sh-sm);border:1px solid var(--border)}
.p-head{display:flex;align-items:center;gap:24px;margin-bottom:32px;padding-bottom:32px;border-bottom:1px solid var(--border)}
.p-avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--hover);border:1px solid var(--border)}
.p-name{font-size:22px;font-weight:700}.p-sub{color:var(--sub);font-size:14px}
.field{margin-bottom:24px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
.field input,.field textarea{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg);color:var(--text);outline:none;transition:.2s}
.field input:focus,.field textarea:focus{border-color:var(--text);background:var(--card)}
.up-area{position:relative;border:1px dashed var(--border);border-radius:var(--r);padding:32px;text-align:center;background:var(--bg);cursor:pointer;transition:.2s}
.up-area:hover{border-color:var(--sub)}
.up-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.up-area.has-img{padding:0;border:none;background:transparent}
.up-area.has-img .up-icon,.up-area.has-img .up-text{display:none}
.up-area img.preview{width:100%;height:auto;border-radius:var(--r-sm);max-height:240px;object-fit:cover}
.btn-main{background:var(--text);color:var(--bg);width:100%;padding:14px;border:none;border-radius:var(--r-sm);font-weight:600;font-size:15px;transition:.2s}
.btn-main:hover{opacity:.9}.btn-main:disabled{opacity:.5;cursor:not-allowed}
.ch-block{border:1px solid var(--border);padding:20px;border-radius:var(--r);margin-bottom:16px}
.ch-head{display:flex;justify-content:space-between;margin-bottom:16px;font-weight:600}
.ch-del{background:none;border:none;color:var(--danger);cursor:pointer;font-size:13px}
/* 模态 */
.overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex;animation:fadeIn .2s}
.panel{background:var(--card);width:100%;max-width:400px;border-radius:var(--r-lg);padding:32px;box-shadow:var(--sh-lg);animation:popIn .3s var(--ease)}
.panel h2{font-size:20px;font-weight:700;margin-bottom:24px}
.tabs{display:flex;gap:24px;margin-bottom:24px;border-bottom:1px solid var(--border)}
.tabs button{background:none;border:none;padding:0 0 12px;font-size:15px;font-weight:500;color:var(--sub);cursor:pointer;position:relative}
.tabs button.active{color:var(--text);font-weight:600}
.tabs button.active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--text)}
.msg{font-size:13px;color:var(--danger);margin-bottom:16px;min-height:20px}
.terms{background:var(--bg);padding:16px;border-radius:var(--r-sm);height:200px;overflow-y:auto;font-size:13px;color:var(--sub);margin-bottom:16px}
#toastHost{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:10000;pointer-events:none}
.toast{background:var(--text);color:var(--bg);padding:10px 20px;border-radius:var(--pill);font-size:13px;font-weight:500;box-shadow:var(--sh-md);animation:fadeUp .3s var(--ease)}
/* 移动端 */
.mobile-tabbar{display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);transition:transform .3s var(--ease)}
body.dark .mobile-tabbar{background:rgba(10,10,10,.9)}
.tab-inner{display:flex;height:var(--tab-h)}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--sub);background:none;border:none;transition:.2s}
.tab-item svg{width:22px;height:22px}.tab-item span{font-size:10px;font-weight:500}.tab-item.active{color:var(--text)}
@media(max-width:768px){
:root{--h-h:56px;--maxw:100%}
.h-inner{padding:0 16px;gap:12px}.nav-links{display:none}.search-box{max-width:100%}.btn-text{display:none}
.u-menu{display:none;} /* 移动端隐藏旧菜单，改用底部抽屉 */
.cat-inner{padding:12px 16px}main{padding:24px 16px 80px}
.feat-layout{grid-template-columns:1fr}.feat-main{flex-direction:column}.fm-cover{width:100%;height:180px}.fm-info{padding:20px}
.books-grid{grid-template-columns:repeat(2,1fr);gap:16px}
.detail-wrap{padding:24px 16px;border:none;box-shadow:none;background:transparent}
.detail-header{flex-direction:column;gap:20px;align-items:center;text-align:center;padding-bottom:24px;margin-bottom:24px}
.detail-title{font-size:24px}
.detail-actions{justify-content:center}
.r-layout{grid-template-columns:1fr;padding:0 16px 80px;gap:24px}
.ch-list{position:static;max-height:none;display:none}
.r-content{padding:24px 16px;border:none;box-shadow:none;background:transparent}
.r-title{font-size:24px}.ch-text{font-size:17px;line-height:1.8}
.p-card,.panel{padding:24px 16px;border-radius:var(--r)}
.dash-grid{grid-template-columns:1fr}
.mobile-tabbar{display:block}body{padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom))}
}

<script>
(function(){
'use strict';
// 全局错误捕获，防止无提示白屏
window.onerror = function(msg, url, line, col, error) {

      <p style="color:var(--sub);margin-bottom:20px;">请尝试刷新重试</p>
      <button class="btn-solid" onclick="location.reload()">刷新页面</button>
    </div>`;
  }
};

const SUPABASE_URL='https://wxviktechcqrpudbdzhu.supabase.co';
const SUPABASE_KEY='sb_publishable_EehU7zcjbdnqBVecQxhkmg_-k6ebejG';
let supabaseClient=null;
const DEFAULT_AVATAR="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23EBEBEB'/%3E%3Ccircle cx='50' cy='38' r='16' fill='none' stroke='%23B0B0B0' stroke-width='8'/%3E%3Cpath d='M22 88 Q 50 60 78 88' fill='none' stroke='%23B0B0B0' stroke-width='8'/%3E%3C/svg%3E";
const USER_CACHE_KEY='ns_user';
const THEME_KEY='ns_theme';
const DRAFT_KEY='ns_draft_';
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
function timeAgo(ts){const d=Date.now()-ts;if(d<60000)return '刚刚';if(d<3600000)return Math.floor(d/60000)+' 分钟前';if(d<86400000)return Math.floor(d/3600000)+' 小时前';return Math.floor(d/86400000)+' 天前';}
function formatNum(n){n=Number(n)||0;if(n>=10000)return (n/10000).toFixed(1)+'w';return String(n);}
function isValidAvatar(a){return typeof a==='string'&&(a.startsWith('http')||a.startsWith('data:'));}
let toastSeq=0;
window.toast=function(msg){const host=$('toastHost');if(!host)return;const el=document.createElement('div');el.className='toast';el.textContent=msg;host.appendChild(el);const id=++toastSeq;setTimeout(()=>{if(id===toastSeq)el.remove();},2500);};
function syncScrollLock(){document.body.classList.toggle('lock',!!document.querySelector('.overlay.show'));}
window.showOverlay=function(id){const el=$(id);if(el){el.classList.add('show');syncScrollLock();}};
window.hideOverlay=function(id){const el=$(id);if(el){el.classList.remove('show');syncScrollLock();}};

const State={user:null,view:'home',category:'全部',novelId:null,chapterIndex:0,keyword:'',novels:[],shelf:[],comments:[],theme:'light',isZen:false,editId:null};
let authMode='login';let searchTimer=null;let currentScrollHandler=null;
try{if(window.supabase)supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);}catch(e){console.warn('Supabase 初始化失败',e);}

const DB={
async getProfile(id){if(!supabaseClient)return null;try{const{data}=await supabaseClient.from('profiles').select('*').eq('id',id).maybeSingle();return data;}catch(e){return null;}},
async updateProfile(id,patch){if(!supabaseClient)return;await supabaseClient.from('profiles').update(patch).eq('id',id);},
async getShelf(id){const p=await this.getProfile(id);return Array.isArray(p?.shelf)?p.shelf:[];},
async toggleShelf(id,nid){const s=await this.getShelf(id);const i=s.indexOf(nid);if(i>=0)s.splice(i,1);else s.push(nid);await this.updateProfile(id,{shelf:s});State.shelf=s;return s.includes(nid);},
async getComments(nid,idx){if(!supabaseClient)return [];try{const{data,error}=await supabaseClient.from('comments').select('*').eq('novel_id',nid).eq('chapter_index',idx).order('created_at',{ascending:false});if(error)throw error;return data||[];}catch(e){return[];}},
async addComment(payload){if(!supabaseClient)throw new Error('未连接');const content=(payload.content||'').trim();if(!content)throw new Error('内容为空');const{data,error}=await supabaseClient.from('comments').insert([{novel_id:payload.nid,chapter_index:payload.idx,parent_id:payload.parentId||null,content,username:payload.user.username,nickname:payload.user.nickname,avatar:payload.user.avatar,user_id:payload.user.id}]).select();if(error)throw new Error(error.message);return data[0];},
async deleteComment(id){if(supabaseClient)await supabaseClient.from('comments').update({deleted:true}).eq('id',id);},
async toggleLike(id,user){if(!supabaseClient)return;const{data}=await supabaseClient.from('comments').select('likes').eq('id',id).single();if(!data)return;let l=Array.isArray(data.likes)?data.likes:[];if(l.includes(user))l=l.filter(u=>u!==user);else l.push(user);await supabaseClient.from('comments').update({likes:l}).eq('id',id);},
async publishNovel(data){if(!supabaseClient)throw new Error('未连接');const{error}=await supabaseClient.from('novels').insert([data]);if(error)throw new Error(error.message);},
async updateNovel(id,uid,data){if(!supabaseClient)throw new Error('未连接');const{error}=await supabaseClient.from('novels').update(data).eq('id',id).eq('uploader_id',uid);if(error)throw new Error(error.message);},
async deleteNovel(id,uid){if(!supabaseClient)return;await supabaseClient.from('novels').delete().eq('id',id).eq('uploader_id',uid);}
};

window.enterSite=function(){
  const sp=$('splash');if(sp){sp.classList.add('hide');setTimeout(()=>sp.remove(),500);}
  localStorage.setItem('ns_entered','1');document.body.classList.remove('lock');
  setTimeout(()=>{const agreed=localStorage.getItem('ns_agreed')==='1';if(!agreed)showOverlay('disclaimerOverlay');},500);
};
window.acceptDisclaimer=function(){if(!$('agreeCheck').checked)return;localStorage.setItem('ns_agreed','1');hideOverlay('disclaimerOverlay');};
function updateMobileTab(view){document.querySelectorAll('.tab-item').forEach(el=>el.classList.remove('active'));if(view==='home')$('tab-home')?.classList.add('active');if(view==='shelf')$('tab-shelf')?.classList.add('active');if(view==='dash')$('tab-upload')?.classList.add('active');}
window.setCategory=function(cat){State.category=cat;document.querySelectorAll('.cat-item').forEach(el=>el.classList.toggle('active',el.textContent===cat));renderHome($('app'));};

window.goHome=function(tab){
  State.view='home';State.novelId=null;document.body.classList.remove('zen');
  if(tab==='shelf'){if(!State.user){window.openAuth('login');return;}updateMobileTab('shelf');}else{updateMobileTab('home');}
  syncScrollLock();renderHome($('app'),tab);window.scrollTo({top:0});
};

window.onSearch=function(immediate){State.keyword=($('searchInput').value||'').trim();if(State.view!=='home'){State.view='home';State.novelId=null;}if(immediate){renderHome($('app'),'all');return;}clearTimeout(searchTimer);searchTimer=setTimeout(()=>renderHome($('app'),'all'),300);};

window.openNovel=function(id){
  const novel=State.novels.find(n=>n.id===id);if(!novel)return;
  State.view='detail';State.novelId=id;document.body.classList.remove('zen');
  syncScrollLock();renderDetail($('app'));window.scrollTo({top:0});
};

window.startReading=function(id,idx){
  const novel=State.novels.find(n=>n.id===id);if(!novel)return;
  State.view='reader';State.novelId=id;document.body.classList.remove('zen');
  const chapters=Array.isArray(novel.chapters)?novel.chapters:[];
  if(idx!=null){State.chapterIndex=idx;}
  else{
    let saved=null;try{saved=JSON.parse(localStorage.getItem('ns_prog')||'{}')[id];}catch(e){}
    State.chapterIndex=Math.min(saved!=null?saved:0,Math.max(0,chapters.length-1));
  }
  syncScrollLock();renderReader($('app'));window.scrollTo({top:0});
  if(supabaseClient)supabaseClient.from('novels').update({views:(novel.views||0)+1}).eq('id',id);
};

window.openChapter=function(idx){
  const novel=State.novels.find(n=>n.id===State.novelId);
  if(!novel||!novel.chapters||idx<0||idx>=novel.chapters.length)return;
  if(!State.user&&idx>0){window.openAuth('login');return;}
  State.chapterIndex=idx;
  try{const p=JSON.parse(localStorage.getItem('ns_prog')||'{}');p[State.novelId]=idx;localStorage.setItem('ns_prog',JSON.stringify(p));}catch(e){}
  renderReader($('app'));window.scrollTo({top:0});
};

window.toggleZen=function(){State.isZen=!State.isZen;document.body.classList.toggle('zen',State.isZen);};
window.changeFontSize=function(delta){const cur=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--fs'),10)||17;let next=cur+delta;if(next<14)next=14;if(next>24)next=24;document.documentElement.style.setProperty('--fs',next+'px');};

window.toggleNovelLike=async function(nid,ev){if(!State.user){window.openAuth('login');return;}const n=State.novels.find(x=>x.id===nid);if(!n)return;let l=Array.isArray(n.likes)?n.likes.slice():[];const i=l.indexOf(State.user.id);const was=i>=0;if(was)l.splice(i,1);else l.push(State.user.id);if(supabaseClient)await supabaseClient.from('novels').update({likes:l}).eq('id',nid);n.likes=l;if(State.view==='detail')renderDetail($('app'));else renderReader($('app'));toast(was?'已取消':'点赞成功');};
window.onToggleFav=async function(nid){if(!State.user){window.openAuth('login');return;}const added=await DB.toggleShelf(State.user.id,nid);toast(added?'已加入书架':'已移出书架');if(State.view==='detail')renderDetail($('app'));else renderReader($('app'));};
window.doLogout=async function(){if(!confirm('确定退出？'))return;if(supabaseClient)await supabaseClient.auth.signOut();State.user=null;State.shelf=[];localStorage.removeItem(USER_CACHE_KEY);window.goHome('all');renderTopbar();toast('已退出');};
window.openAuth=function(mode='login'){switchAuth(mode);showOverlay('authOverlay');};
window.switchAuth=function(mode){authMode=mode;const isReg=mode==='register';$('tabLogin').classList.toggle('active',!isReg);$('tabRegister').classList.toggle('active',isReg);$('nicknameField').style.display=isReg?'block':'none';$('confirmField').style.display=isReg?'block':'none';$('authSubmit').textContent=isReg?'注册':'登录';$('authMsg').textContent='';};
window.submitAuth=async function(){if(!supabaseClient){toast('未连接云端');return;}const u=$('authUser').value.trim(),p=$('authPass').value,p2=$('authPass2').value,n=$('authNickname').value.trim(),msg=$('authMsg'),btn=$('authSubmit');msg.textContent='';if(!u){msg.textContent='请输入用户名';return;}if(p.length<6){msg.textContent='密码至少6位';return;}if(authMode==='register'&&p!==p2){msg.textContent='两次密码不一致';return;}btn.disabled=true;btn.textContent='处理中...';const email=u+'@novel.com';try{if(authMode==='register'){const{data,error}=await supabaseClient.auth.signUp({email,password:p});if(error)throw new Error(error.message);await supabaseClient.from('profiles').insert([{id:data.user.id,username:u,nickname:n||u,avatar:DEFAULT_AVATAR,shelf:[],progress:{},coins:0,exp:0}]);msg.style.color='var(--success)';msg.textContent='注册成功，请登录';setTimeout(()=>switchAuth('login'),1000);}else{const{data,error}=await supabaseClient.auth.signInWithPassword({email,password:p});if(error)throw new Error('用户名或密码错误');const pData=await DB.getProfile(data.user.id);State.user={id:data.user.id,username:pData.username,nickname:pData.nickname,avatar:isValidAvatar(pData.avatar)?pData.avatar:DEFAULT_AVATAR,coins:pData.coins||0,exp:pData.exp||0};State.shelf=Array.isArray(pData.shelf)?pData.shelf:[];localStorage.setItem(USER_CACHE_KEY,JSON.stringify(State.user));hideOverlay('authOverlay');renderTopbar();window.goHome('all');toast('欢迎回来');}}catch(e){msg.style.color='var(--danger)';msg.textContent=e.message;}finally{btn.disabled=false;btn.textContent=authMode==='register'?'注册':'登录';}};

window.goProfile=function(){if(!State.user){window.openAuth('login');return;}State.view='profile';closeMobileMenu();syncScrollLock();renderProfile($('app'));window.scrollTo({top:0});};
window.goDashboard=function(){
  if(!State.user){window.openAuth('login');return;}
  State.view='dashboard';closeMobileMenu();updateMobileTab('dash');syncScrollLock();renderDashboard($('app'));window.scrollTo({top:0});
};

window.goUpload=function(editId=null){
  if(!State.user){window.openAuth('login');return;}
  State.view='upload';State.editId=editId;closeMobileMenu();updateMobileTab('dash');syncScrollLock();renderUpload($('app'),editId);window.scrollTo({top:0});
};

window.deleteMyNovel=async function(id){
  if(!confirm('⚠️ 确定要下架这本书吗？所有章节和评论将被永久删除。'))return;
  try{await DB.deleteNovel(id,State.user.id);toast('已下架');State.novels=[];renderDashboard($('app'));}catch(e){toast(e.message);}
};

window.toggleUserMenu=function(e){
  if(window.innerWidth <= 768){
    openMobileMenu();
    return;
  }
  const menu = $('userMenu');
  if(menu) menu.classList.toggle('active');
};

window.openMobileMenu = function() {
  if(!State.user) { window.openAuth('login'); return; }
  const sheet = $('mobileMenuSheet');
  const overlay = $('mobileMenuOverlay');
  const content = $('mobileMenuContent');
  
  content.innerHTML = `
    <div class="mobile-menu-header">
      <div class="h-name">${esc(State.user.nickname)}</div>

async function renderHome(app,tab='all'){

    if(!State.novels.length){

      if(supabaseClient){
        const{data,error}=await supabaseClient.from('novels').select('*').order('created_at',{ascending:false});

        State.novels=(data||[]).map(n=>({...n,views:n.views||0,likes:n.likes||[],chapters:n.chapters||[]}));

        State.novels=[]; // 未连接云端时置空

    let list=State.novels;
    if(tab==='shelf'){const shelf=State.shelf.length?State.shelf:(State.user?await DB.getShelf(State.user.id):[]);list=list.filter(n=>shelf.includes(n.id));}

async function renderReader(app){

utton><button class="btn-nav" onclick="openChapter(${State.chapterIndex+1})" ${State.chapterIndex>=chapters.length-1?'disabled':''}>下一章</button></div>`:'<p>暂无正文</p>'}<div class="comments" onclick="event.stopPropagation()"><h3>评论</h3>${State.user?`<div class="c-form"><textarea id="cInput" placeholder="写下你的想法..."></textarea><div class="actions"><span class="hint">以 ${esc(State.user.nickname)} 发布</span><button class="btn-solid" onclick="submitComment()">发送</button></div></div>`:'<p style="color:var(--sub);margin-bottom:24px;"><a onclick="openAuth()" style="text-decoration:underline;cursor:pointer;">登录</a> 后参与评论</p>'}<div id="commentList">加载中...</div></div></div></div></div>`;
    DB.getComments(novel.id,State.chapterIndex).then(comments=>{State.comments=comments;const list=$('commentList');if(list){if(!comments.length){list.innerHTML='<p style="color:var(--light);font-size:13px;">还没有评论，快来抢沙发吧</p>';}else{const tops=comments.filter(c=>!c.parent_id);list.innerHTML=tops.map(c=>{const replies=comments.filter(r=>r.parent_id===c.id).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));return renderCommentItem(c,false,isAuthor)+(replies.length?`<div class="replies">${replies.map(r=>renderCommentItem(r,true,isAuthor)).join('')}</div>`:'');}).join('');}}}).catch(e=>{const list=$('commentList');if(list)list.innerHTML='<p style="color:var(--danger);font-size:13px;">评论加载失败</p>';});
    if(currentScrollHandler)window.removeEventListener('scroll',currentScrollHandler);currentScrollHandler=()=>{const bar=$('readBar');if(!bar)return;const st=window.scrollY;const sh=document.documentElement.scrollHeight-window.innerHeight;bar.style.width=(sh>0?(st/sh)*100:0)+'%';};window.addEventListener('scroll',currentScrollHandler,{passive:true});

function renderCommentItem(c,isReply,isAuthorOfBook){
  const isMine=State.user&&State.user.username===c.username;
  const isLiked=State.user&&(c.likes||[]).includes(State.user.username);

  return `<div class="comment" style="${isReply?'padding:12px 0;border:none;':''}"><img src="${isValidAvatar(c.avatar)?esc(c.avatar):DEFAULT_AVATAR}" class="c-av"><div class="c-body"><div class="c-head"><span class="c-name">${esc(c.nickname)}</span>${isCommentAuthor?'<span class="c-badge up">作者</span>':''}${isMine?'<span class="c-badge">我</span>':''}<span class="c-time">${timeAgo(new Date(c.created_at).getTime())}</span></div><div class="c-text">${esc(c.content).replace(/\n/g,'<br>')}</div><div class="c-actions"><button class="${isLiked?'liked':''}" onclick="likeComment('${c.id}')">赞 ${(c.likes||[]).length||''}</button>${!isReply?`<button onclick="toggleReplyBox('${c.id}')">回复</button>`:''}${showDelete?`<button class="danger" onclick="deleteComment('${c.id}')">删除</button>`:''}</div><div id="reply-box-${c.id}" style="margin-top:12px;"></div></div></div>`;
}

window.submitReply=async function(parentId){if(!State.user)return;const box=$('reply-box-'+parentId);if(!box)return;const ta=box.querySelector('textarea');if(!ta)return;const txt=ta.value.trim();if(!txt)return;const btn=box.querySelector('.btn-solid');if(btn){btn.disabled=true;btn.textContent='回复中...';}try{await DB.addComment({nid:State.novelId,idx:State.chapterIndex,parentId,content:txt,user:State.user});toast('回复成功');renderReader($('app'));}catch(e){toast(e.message);if(btn){btn.disabled=false;btn.textContent='回复';}}};

  draftTimer=setTimeout(()=>{
    const data={
      title:$('uTitle')?.value.trim()||'',
      intro:$('uIntro')?.value.trim()||'',
      cover:window._cover||'',
      chapters:Array.from(document.querySelectorAll('.ch-block')).map(b=>({
        title:b.querySelector('.c-title')?.value.trim()||'',
        content:b.querySelector('.c-content')?.value.trim()||''
      })).filter(c=>c.title||c.content)
    };
    try{localStorage.setItem(DRAFT_KEY+'new',JSON.stringify(data));const el=$('draftStatus');if(el){el.textContent='草稿已自动保存';el.style.opacity=1;setTimeout(()=>el.style.opacity=0,2000);}}catch(e){}
  },1000);
};

window.handleCover=function(input){if(!input.files[0])return;const reader=new FileReader();reader.onload=e=>{const area=$('upArea');area.classList.add('has-img');area.querySelector('.up-icon')?.remove();area.querySelector('.up-text')?.remove();area.querySelector('.preview')?.remove();const img=document.createElement('img');img.src=e.target.result;img.className='preview';area.appendChild(img);window._cover=e.target.result;saveDraft();};reader.readAsDataURL(input.files[0]);};

window.publish=async function(editId){
  const title=$('uTitle').value.trim(),intro=$('uIntro').value.trim();
  if(!title)return toast('请输入书名');
  const chapters=[];
  document.querySelectorAll('.ch-block').forEach(b=>{
    const t=b.querySelector('.c-title').value.trim(),c=b.querySelector('.c-content').value.trim();
    if(t&&c)chapters.push({title:t,content:c});
  });
  if(!chapters.length)return toast('请至少填写一个完整章节');
  const btn=$('pubBtn');btn.disabled=true;btn.textContent='处理中...';
  const data={title,author:State.user.nickname,intro,tags:[],cover:window._cover||window._editCover||'',chapters};
  try{
    if(editId){await DB.updateNovel(editId,State.user.id,data);toast('修改成功');}
    else{await DB.publishNovel({...data,uploader_id:State.user.id,views:0,likes:[]});localStorage.removeItem(DRAFT_KEY+'new');toast('发布成功');}
    State.novels=[];
    window.goDashboard();
  }catch(e){toast(e.message);btn.disabled=false;btn.textContent=editId?'保存修改':'发布';}
};

async function renderProfile(app){if(!app)return;const u=State.user;if(!u){window.goHome();return;}app.innerHTML=`<div class="p-card anim-up"><div class="p-head"><img src="${isValidAvatar(u.avatar)?esc(u.avatar):DEFAULT_AVATAR}" class="p-avatar"><div><div class="p-name">${esc(u.nickname)}</div><div class="p-sub">@${esc(u.username)}</div></div></div><div style="display:flex;gap:12px;"><button class="btn-solid" style="flex:1;" onclick="goDashboard()">作者后台</button><button class="btn-text" style="flex:1;border:1px solid var(--border);" onclick="doLogout()">退出登录</button></div></div>`;}

document.addEventListener('click',e=>{const um=$('userMenu');if(um&&!um.contains(e.target))um.classList.remove('active');});
document.querySelectorAll('.overlay').forEach(el => {el.addEventListener('click', e => { if (e.target === el && el.id !== 'disclaimerOverlay') hideOverlay(el.id); });});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){document.querySelectorAll('.overlay.show').forEach(el=>{if(el.id!=='disclaimerOverlay'){el.classList.remove('show');syncScrollLock();}});const um=$('userMenu');if(um)um.classList.remove('active');if(State.isZen)toggleZen();closeMobileMenu();}
  if(State.view==='reader'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){if(e.key==='ArrowLeft'){e.preventDefault();window.openChapter(State.chapterIndex-1);}else if(e.key==='ArrowRight'){e.preventDefault();window.openChapter(State.chapterIndex+1);}}
});
window.addEventListener('resize', () => {
  const el = $('topbarRight');
  if(!el || !State.user) return;
  const uMenu = el.querySelector('.u-menu');
  const mobileBtn = el.querySelector('#mobileAvatarBtn');
  if(uMenu && mobileBtn) {
    if(window.innerWidth <= 768) {
      uMenu.style.display = 'none';
      mobileBtn.style.display = 'block';
    } else {
      uMenu.style.display = 'block';
      mobileBtn.style.display = 'none';
      closeMobileMenu();
    }
  }
});
document.addEventListener('DOMContentLoaded',()=>{$('agreeCheck')?.addEventListener('change',e=>{$('agreeBtn').disabled=!e.target.checked;});});

async function init(){
  try{
    const savedTheme=localStorage.getItem(THEME_KEY)||'light';if(savedTheme==='dark')document.body.classList.add('dark');
    const cached=localStorage.getItem(USER_CACHE_KEY);if(cached){State.user=JSON.parse(cached);State.shelf=State.user.shelf||[];}
    renderTopbar();
    const hasEntered=localStorage.getItem('ns_entered');
    if(!hasEntered){document.body.classList.add('lock');}
    else{const sp=$('splash');if(sp)sp.remove();document.body.classList.remove('lock');const agreed=localStorage.getItem('ns_agreed')==='1';if(!agreed)showOverlay('disclaimerOverlay');}
    await renderHome($('app'),'all');
    if(supabaseClient){try{const{data:{session}}=await supabaseClient.auth.getSession();if(session){const p=await DB.getProfile(session.user.id);if(p){State.user={id:session.user.id,username:p.username,nickname:p.nickname,avatar:isValidAvatar(p.avatar)?p.avatar:DEFAULT_AVATAR,coins:p.coins||0,exp:p.exp||0};State.shelf=Array.isArray(p.shelf)?p.shelf:[];localStorage.setItem(USER_CACHE_KEY,JSON.stringify(State.user));renderTopbar();}}}catch(e){}}
  }catch(err){
    console.error('Init error',err);
  }
}
init();
})();
</script>
</body>
</html>
